apiVersion: v1
kind: ReplicationController
metadata: 
   name: myreplica-app
   labels:
      name: myrep
      type: frontend



spec:
  template:
     metadata:
       name: nginx-app
       labels: 
          name: nginxapp
          type: backend
     
     spec:
       containers:
         - name: ngnix
           image: nginx

  replicas: 3
  