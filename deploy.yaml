apiVersion: apps/v1
kind: Deployment 
metadata: 
   name: nginx-deployment
   labels: 
      name: nginx-deployment
      type: Frontend
spec:
  template:
     metadata: 
        name: nginx-app
        labels: 
          name: nginx-app
          type: backend
     spec:
        containers:
          - name: nginx-container
            image: nginx      
  replicas: 3
  selector:
    matchLabels:
      type: backend